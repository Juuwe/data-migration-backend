{{template "base" .}}

{{define "content"}}
<form id="filter-form" action="/grid" method="GET" class="filter-section">
  <div class="filter-header">
    <span class="filter-label">Время за Гб (сек)</span>
    <span class="filter-value" id="range-value">
      {{printf "%g" .Data.MinTime}} — {{printf "%g" .Data.MaxTime}} cек/Гб
    </span>
  </div>

  <div class="range-slider-container">
    <div class="range-track-bg"></div>
    <div class="range-track-active" id="range-track" aria-hidden="true"></div>
    <input
      type="range"
      id="slider-min"
      name="min_time"
      min="0.01"
      max="1.00"
      step="0.01"
      value="{{printf "%g" .Data.MinTime}}"
      class="range-input"
    >
    <input
      type="range"
      id="slider-max"
      name="max_time"
      min="0.01"
      max="1.00"
      step="0.01"
      value="{{printf "%g" .Data.MaxTime}}"
      class="range-input"
    >
  </div>
</form>

<button class="search-btn" type="submit" form="filter-form">Найти</button>

<section class="cards-grid">
  {{range .Data.Methods}}
    {{template "service_card" .}}
  {{else}}
    <p class="no-data">Услуги миграции не найдены</p>
  {{end}}
</section>
{{end}}

{{define "scripts"}}
<script>
  const sliderMin = document.getElementById('slider-min');
  const sliderMax = document.getElementById('slider-max');
  const rangeTrack = document.getElementById('range-track');
  const rangeValue = document.getElementById('range-value');
  const minGap = 0.05;

  function formatNumber(value) {
    return Number.parseFloat(value.toFixed(2)).toString();
  }

  function updateSlider(event) {
    let minValue = Number.parseFloat(sliderMin.value);
    let maxValue = Number.parseFloat(sliderMax.value);

    if (maxValue - minValue < minGap) {
      if (event?.target === sliderMin) {
        minValue = maxValue - minGap;
        sliderMin.value = minValue.toFixed(2);
      } else {
        maxValue = minValue + minGap;
        sliderMax.value = maxValue.toFixed(2);
      }
    }

    const sliderStart = Number.parseFloat(sliderMin.min);
    const sliderRange = Number.parseFloat(sliderMin.max) - sliderStart;
    const trackOffset = 19;
    const trackWidth = sliderMin.closest('.range-slider-container').clientWidth - trackOffset * 2;
    const left = trackOffset + ((minValue - sliderStart) / sliderRange) * trackWidth;
    const right = trackOffset + ((maxValue - sliderStart) / sliderRange) * trackWidth;

    rangeTrack.style.left = `${left}px`;
    rangeTrack.style.width = `${right - left}px`;
    rangeValue.textContent = `${formatNumber(minValue)} — ${formatNumber(maxValue)} cек/Гб`;
  }

  sliderMin.addEventListener('input', updateSlider);
  sliderMax.addEventListener('input', updateSlider);
  window.addEventListener('resize', updateSlider);
  updateSlider();
</script>
{{end}}
