{{template "base" .}}

{{define "content"}}
<form id="filter-form" action="/grid" method="GET" class="filter-section">
  <div class="filter-header">
    <span class="filter-label">Время за Гб (сек)</span>
    <span class="filter-value" id="range-value">
      {{printf "%g" .Data.MinTime}} — {{printf "%g" .Data.MaxTime}} cек/Гб
    </span>
  </div>

  <div class="range-slider-container">
    <div class="range-track-bg"></div>
    <input
      type="range"
      name="min_time"
      min="0.01"
      max="1.00"
      step="0.01"
      value="{{printf "%g" .Data.MinTime}}"
      class="range-input"
    >
    <input
      type="range"
      name="max_time"
      min="0.01"
      max="1.00"
      step="0.01"
      value="{{printf "%g" .Data.MaxTime}}"
      class="range-input"
    >
  </div>
</form>

<button class="search-btn" type="submit" form="filter-form">Найти</button>

<section class="cards-grid">
  {{range .Data.Methods}}
    {{template "service_card" .}}
  {{else}}
    <p class="no-data">Услуги миграции не найдены</p>
  {{end}}
</section>
{{end}}
