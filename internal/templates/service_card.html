{{define "service_card"}}
<article class="service-card">
  <a href="/feed?id={{.ID}}" class="service-card-link">
    <div class="card-media">
      <img src="{{.ImageURL}}" alt="{{.Title}}" class="card-img">
      <div class="card-like-badge" aria-label="Количество лайков: {{.LikesCount}}">
        <i class="bi bi-heart-fill card-like-icon"></i>
        <span>{{.LikesCount}}</span>
      </div>
    </div>
    <h3 class="card-title">{{.Title}}</h3>
  </a>

  <div class="card-actions-row">
    <div class="card-time" aria-label="Время обработки одного гигабайта">
      <i class="bi bi-clock card-clock-icon"></i>
      <span>{{printf "%g" .TimeInGb}} сек/Гб</span>
    </div>

    <form action="/methods/{{.ID}}/delete" method="POST" class="delete-form">
      <button type="submit" class="delete-btn" aria-label="Удалить {{.Title}}" title="Удалить">
        <i class="bi bi-trash"></i>
      </button>
    </form>
  </div>
</article>
{{end}}
