{{template "base" .}}

{{define "content"}}
<h1 class="page-title">Новая услуга миграции</h1>

  <form class="create-form" action="/add/publish" method="POST">
    <div class="media-upload-grid current-media-preview">
      <div class="upload-field-group">
        <label class="form-label">Фотография</label>
        <div class="media-preview-container">
          <img
            src="{{if .Data.Draft.ImageURL}}{{.Data.Draft.ImageURL}}{{else}}/static/images/default.svg{{end}}"
            alt="{{if .Data.Draft.ImageURL}}{{.Data.Draft.Title}}{{else}}Изображение услуги по умолчанию{{end}}"
            class="preview-media"
          >
        </div>
      </div>
      <div class="upload-field-group">
        <label class="form-label">Видео</label>
        <div class="media-preview-container">
          {{if .Data.Draft.VideoKey}}
            <video
              src="{{.Data.Draft.VideoURL}}"
              poster="/static/images/default.svg"
              class="preview-media"
              autoplay
              loop
              muted
              playsinline
            ></video>
          {{else}}
            <div class="video-fallback" role="img" aria-label="Видео услуги по умолчанию">
              <img src="/static/images/default.svg" alt="" class="preview-media">
              <span class="video-fallback-label">
                <i class="bi bi-camera-video"></i>
                Видео по умолчанию
              </span>
            </div>
          {{end}}
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="title-input">Название услуги</label>
      <input type="text" name="title" id="title-input" class="form-input" value="{{.Data.Draft.Title}}" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="description-input">Краткая информация</label>
      <textarea name="description" id="description-input" class="form-input form-textarea" placeholder="Введите описание услуги..." required>{{.Data.Draft.Description}}</textarea>
    </div>

    <div class="metrics-grid">
      <div class="form-group">
        <label class="form-label" for="speed-input">Время за Гб (сек)</label>
        <input type="number" step="0.01" name="time_in_gb" id="speed-input" class="form-input" value="{{if gt .Data.Draft.TimeInGb 0.0}}{{.Data.Draft.TimeInGb}}{{end}}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reliability-input">Коэф. надежности</label>
        <input type="number" step="0.001" name="reliability" id="reliability-input" class="form-input" value="{{if gt .Data.Draft.Reliability 0.0}}{{.Data.Draft.Reliability}}{{end}}" required>
      </div>
    </div>

  </form>
{{end}}
