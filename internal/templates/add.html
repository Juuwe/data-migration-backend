{{template "base" .}}

{{define "content"}}
<h1 class="page-title">Новая услуга миграции</h1>

<form class="create-form" action="/add" method="POST" enctype="multipart/form-data">
  <!-- Скрытое поле ID текущего черновика -->
  <input type="hidden" name="id" value="{{.Data.Draft.ID}}">

  <div class="media-upload-grid">
    <!-- Блок изображения -->
    <div class="upload-field-group">
      <label class="form-label">Фото</label>
      <div class="media-preview-container">
        {{if .Data.Draft.ImageURL}}
          <img src="{{.Data.Draft.ImageURL}}" alt="Превью фото" class="preview-media">
        {{else}}
          <div class="media-placeholder">Нет фото</div>
        {{end}}
        <input type="file" name="image" accept="image/*" class="file-input">
      </div>
    </div>

    <!-- Блок видео -->
    <div class="upload-field-group">
      <label class="form-label">Видео</label>
      <div class="media-preview-container">
        {{if .Data.Draft.VideoURL}}
          <video src="{{.Data.Draft.VideoURL}}" controls class="preview-media"></video>
        {{else}}
          <div class="media-placeholder">Нет видео</div>
        {{end}}
        <input type="file" name="video" accept="video/*" class="file-input">
      </div>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="method-input">Метод</label>
    <input type="text" name="name" id="method-input" class="form-input" value="{{.Data.Draft.Name}}" required>
  </div>

  <div class="form-group">
    <label class="form-label" for="description-input">Описание</label>
    <textarea name="description" id="description-input" class="form-input form-textarea">{{.Data.Draft.Description}}</textarea>
  </div>

  <div class="metrics-grid">
    <div class="form-group">
      <label class="form-label" for="speed-input">Время за Гб (сек)</label>
      <input type="number" step="0.01" name="time_in_gb" id="speed-input" class="form-input" value="{{if gt .Data.Draft.TimeInGb 0.0}}{{.Data.Draft.TimeInGb}}{{end}}" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="reliability-input">Коэф. надежности</label>
      <input type="number" step="0.001" name="reliability" id="reliability-input" class="form-input" value="{{if gt .Data.Draft.Reliability 0.0}}{{.Data.Draft.Reliability}}{{end}}" required>
    </div>
  </div>
</form>
{{end}}
