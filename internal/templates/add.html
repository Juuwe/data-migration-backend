{{template "base" .}}

{{define "content"}}
<h1 class="page-title">Новая услуга миграции</h1>

{{if .Data.Error}}
  <div class="error-message" style="color: #ff4d4f; background: rgba(255,77,79,0.1); padding: 10px; border-radius: 6px; margin-bottom: 16px;">
    {{.Data.Error}}
  </div>
{{end}}

{{if .Data.Exists}}
  <form class="create-form" action="/add/publish" method="POST">
    <div class="form-group">
      <label class="form-label">Название услуги (из черновика)</label>
      <input type="text" class="form-input" value="{{.Data.Draft.Title}}" disabled>
    </div>

    <div class="form-group">
      <label class="form-label" for="description-input">Краткая информация (описание)</label>
      <textarea name="description" id="description-input" class="form-input form-textarea" placeholder="Введите описание услуги..." required>{{.Data.Draft.Description}}</textarea>
    </div>

    <div class="metrics-grid">
      <div class="form-group">
        <label class="form-label" for="speed-input">Время за Гб (сек)</label>
        <input type="number" step="0.01" name="time_in_gb" id="speed-input" class="form-input" value="{{if gt .Data.Draft.TimeInGb 0.0}}{{.Data.Draft.TimeInGb}}{{end}}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reliability-input">Коэф. надежности</label>
        <input type="number" step="0.001" name="reliability" id="reliability-input" class="form-input" value="{{if gt .Data.Draft.Reliability 0.0}}{{.Data.Draft.Reliability}}{{end}}" required>
      </div>
    </div>

    <button type="submit" class="submit-btn" style="margin-top: 16px;">Опубликовать</button>
  </form>
{{else}}
  <form class="create-form" action="/add" method="POST" enctype="multipart/form-data">
    <div class="media-upload-grid">
      <div class="upload-field-group">
        <label class="form-label">Фотография услуги</label>
        <div class="media-preview-container">
          <div class="media-placeholder">Выберите фото</div>
          <input type="file" name="photo" accept="image/*" class="file-input" required>
        </div>
      </div>

      <div class="upload-field-group">
        <label class="form-label">Видеодемонстрация</label>
        <div class="media-preview-container">
          <div class="media-placeholder">Выберите видео</div>
          <input type="file" name="video" accept="video/*" class="file-input" required>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="method-input">Название услуги</label>
      <input type="text" name="title" id="method-input" class="form-input" placeholder="Введите название..." required>
    </div>

    <button type="submit" class="submit-btn" style="margin-top: 16px;">Далее</button>
  </form>
{{end}}
{{end}}
